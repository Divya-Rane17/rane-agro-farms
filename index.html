<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RANE AGRO FARMS | Workforce Registration Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">RANE AGRO FARMS</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#registration">Registration</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#contact">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<!-- Main Heading -->
<div class="container text-center mt-5">
    <h1 class="display-5 fw-bold text-success">
        RANE AGRO FARMS
    </h1>

    <p class="lead">
        Workforce Registration Portal
    </p>

    <p>
        Register your details to work with Rane Agro Farms.
    </p>
</div>
<!-- Worker Registration Form -->
<div class="container my-5" id="registration">
    <div class="card shadow p-4">

        <h2 class="text-center text-success mb-4">
            Worker Registration Form
        </h2>

        <form id="registrationForm">

            <!-- Name -->
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name"
                    placeholder="Enter your full name">
            </div>

            <!-- Age -->
            <div class="mb-3">
                <label for="age" class="form-label">Age</label>
                <input type="number" class="form-control" id="age"
                    placeholder="Enter your age">
            </div>

            <!-- Gender -->
            <div class="mb-3">
                <label for="gender" class="form-label">Gender</label>
                <select class="form-select" id="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Mobile -->
            <div class="mb-3">
                <label for="mobile" class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" id="mobile"
                    placeholder="Enter 10-digit mobile number">
            </div>

            <!-- Village -->
            <div class="mb-3">
                <label for="village" class="form-label">Village</label>
                <input type="text" class="form-control" id="village"
                    placeholder="Enter your village">
            </div>

            <!-- Expected Wage -->
            <div class="mb-3">
                <label for="wage" class="form-label">
                    Expected Daily Wage (₹)
                </label>
                <input type="number" class="form-control" id="wage"
                    placeholder="Enter expected daily wage">
            </div>

            <!-- Work Date -->
            <div class="mb-3">
                <label for="date" class="form-label">Available Work Date</label>
                <input type="date" class="form-control" id="date">
            </div>

            <!-- Buttons -->
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success me-2">
                    Register
                </button>

                <button type="reset" class="btn btn-secondary">
                    Reset
                </button>
            </div>

        </form>
    </div>
</div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Our JavaScript -->
    <script src="script.js"></script>

</body>
</html>
